name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --group lint
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group test
      - run: uv run pytest --cov=soap_client --cov-report=term-missing --cov-fail-under=90 --cov-report=markdown
      
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.md
          if-no-files-found: ignore

  
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --group docs
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v7