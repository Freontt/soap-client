[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[project]
name = "soap-client"
version = "0.1.0"
description = "SOAP client for working with services using SOAP and WSDL."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Freontt", email = "freontt.public@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiolimiter>=1.3.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "zeep[async]>=4.3.3",
]


[project.urls]
Homepage = "https://freontt.github.io/soap-client/"
Repository = "https://github.com/Freontt/soap-client"
Issues = "https://github.com/Freontt/soap-client/issues"


[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.0",
    "pytest-mock>=3.17.0",
]

docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]

lint = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
]


[tool.ruff]
# Set the maximum line length to 100.
target-version = "py313"
line-length = 100
exclude = ["tests"]


[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "PERF",  # perflint
    "RUF",   # ruff-specific
    "UP",    # pyupgrade
    "D",     # pydocstyle
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "T20",   # flake8-print
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "TC",    # flake8-type-checking
    "N",     # Naming
    "C4",    # flake8-comprehensions
    "RSE",   # flake8-raise
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "TRY",   # Correct exception's handling
    "FURB",  # Idioms
    "PL",
    "PT",
    "A",
]
ignore = ["RUF002", "RUF003", "D105", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
show_error_codes = true
pretty = true
exclude = ["build/", "dist/"]
disable_error_code = ["no-untyped-call"]
enable_error_code = [
    "redundant-expr",       # meaningless expressions (x or x)
    "truthy-bool",          # objects with __bool__ always True
    "truthy-iterable",      # literals, always truthy
    "ignore-without-code",  # # type: ignore without the code
    "possibly-undefined",   # the variable may not be defined
    "unused-avoidable",     # forgotten await
    "redundant-self",       # superfluous Self in arguments
    "explicit-override",    # require @override
    "mutable-override",     # redefinition with mutable type
]


[tool.pytest]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "performance: speed metering",
]
