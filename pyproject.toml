[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[project]
name = "soap-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Freontt", email = "kudryavcev300505@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "zeep[async]>=4.3.3",
]


[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]

[tool.ruff]
# Set the maximum line length to 100.
target-version = "py313"
line-length = 100
exclude = ["tests"]


[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "PERF",  # perflint
    "RUF",   # ruff-specific
    "UP",    # pyupgrade
    "D",     # pydocstyle
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "T20",   # flake8-print
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "TC",    # flake8-type-checking
    "N",     # Naming
    "C4",    # flake8-comprehensions
    "RSE",   # flake8-raise
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "TRY",   # Correct exception's handling
    "FURB",  # Idioms
    "PL",
    "PT",
    "A",
]
ignore = ["RUF002", "RUF003", "D105", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
show_error_codes = true
pretty = true
exclude = ["build/", "dist/"]
enable_error_code = [
    "redundant-expr",          # бессмысленные выражения (x or x)
    "truthy-bool",             # объекты, у которых __bool__ всегда True
    "truthy-iterable",         # итералы, всегда truthy
    "ignore-without-code",     # # type: ignore без кода
    "possibly-undefined",      # переменная может быть не определена
    "unused-awaitable",        # забытый await
    "redundant-self",          # лишний Self в аргументах
    "explicit-override",       # требовать @override
    "mutable-override",        # переопределение с изменяемым типом
]


[tool.pytest]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "performance: замеры скорости",
]