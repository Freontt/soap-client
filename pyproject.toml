[project]
name = "soap-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Freontt", email = "kudryavcev300505@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "zeep>=4.3.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "ruff>=0.17.3",
]
