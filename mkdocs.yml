site_name: Soap Client
site_url: https://Freontt.github.io/soap-client/
repo_url: https://github.com/Freontt/soap-client

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

nav:
  - Главная: index.md
  - API: api.md